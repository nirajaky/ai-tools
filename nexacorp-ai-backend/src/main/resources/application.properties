#Database config
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/nexacorp_knowledge
spring.datasource.username=postgres
spring.datasource.password=postgres


#Configure genAI for embedding and GrookAI for chat
# Chat: Groq
spring.ai.model.chat=openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# Disable the OpenAI embedding auto-configuration.
# Google text embeddings have a separate selector below.
spring.ai.model.embedding=none

# Embeddings: Google GenAI
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GENAI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration



